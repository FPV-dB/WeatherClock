# Automatic build and tests: on every push, build the firmware and run the simulator (redraw and flicker
# checks, screen changes) and the security tests (handlers, history, GIF and JPEG fuzzing in 32-bit with
# ASan/UBSan). Actions are pinned by commit hash; arduino-cli is checked against the official SHA-256.
# Nothing here publishes anything.
name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARDUINO_CLI_VERSION: "1.5.1"
      ESP8266_CORE: "esp8266:esp8266@3.1.2"
      ESP8266_INDEX: "https://arduino.esp8266.com/stable/package_esp8266com_index.json"
      GFX: /home/runner/Arduino/libraries/Adafruit_GFX_Library
      JSON: /home/runner/Arduino/libraries/ArduinoJson/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.18.0"

      - name: 32-bit g++ (simulator and tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q g++-multilib

      - name: arduino-cli (checked against the official release SHA-256)
        run: |
          set -o pipefail
          base="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}"
          file="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
          curl -fsSLO "$base/$file"
          curl -fsSL "$base/${ARDUINO_CLI_VERSION}-checksums.txt" | grep " $file\$" | sha256sum -c -
          mkdir -p "$HOME/bin" && tar -xzf "$file" -C "$HOME/bin" arduino-cli
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: ESP8266 core and libraries (project versions)
        run: |
          arduino-cli core update-index --additional-urls "$ESP8266_INDEX"
          arduino-cli core install "$ESP8266_CORE" --additional-urls "$ESP8266_INDEX"
          arduino-cli lib install "Adafruit GFX Library@1.13.0" "Adafruit ST7735 and ST7789 Library@1.11.0" \
            "Adafruit BusIO@1.17.4" "ArduinoJson@7.4.3"

      - name: Simulator (faces, incremental redraw, screen changes) and web panel
        run: |
          want=$(grep "sha256" weatherclock/web.h | head -2)
          bash sim/build.sh
          git checkout -- faces/ docs/ || true
          got=$(grep "sha256" weatherclock/web.h | head -2)
          # the committed web.h must match the web panel source (web/): rebuild it with scripts/build_panel.py
          [ "$want" = "$got" ] || { echo "::error::web panel (web/) changed but weatherclock/web.h was not rebuilt: run python3 scripts/build_panel.py . and commit"; exit 1; }

      - name: Security tests (handlers, history, GIF and JPEG fuzzing)
        run: bash sim/tests.sh 3000

      - name: Firmware
        run: sh build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/weatherclock.ino.bin
            build/weatherclock.ino.bin.gz
            web/out/
          retention-days: 14
